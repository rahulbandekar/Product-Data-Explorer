services:
  - type: web
    name: product-explorer-backend
    runtime: node
    region: oregon  # or singapore, frankfurt, etc.
    buildCommand: |
      npm ci
      npx prisma generate
      npm run build
    startCommand: sh -c "npx prisma migrate deploy && npm run start:prod"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: product-explorer-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: product-explorer-redis
          property: connectionString
      - key: PORT
        value: 4000
      - key: FRONTEND_URL
        value: https://your-frontend-domain.com

databases:
  - name: product-explorer-db
    databaseName: product_explorer
    user: product_explorer_user
    plan: free  # or starter, pro, etc.

redis:
  - name: product-explorer-redis
    plan: free  # or starter, pro, etc.